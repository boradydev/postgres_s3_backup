[tool.poetry]
name = "postgres-s3-backup"
version = "0.1.0"
description = "PostgreSQL dumps to S3 with catch-up scheduling and count retention"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4"
boto3 = "1.43.117"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.14.14", "pyright==1.1.414", "boto3-stubs[s3]==1.43.117"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PT", "ARG"]
[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.pyright]
include = ["src", "scripts", "tests/test_backup.py"]
pythonVersion = "3.11"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
