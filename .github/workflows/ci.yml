name: Backup service CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install poetry==2.5.1
          poetry check --lock
          poetry install --no-root --no-interaction
          poetry run python scripts/export_requirements.py --check
          poetry run ruff check src scripts tests
          poetry run pyright
      - uses: docker/setup-buildx-action@v3
      - name: Build and run unit tests in Linux
        run: |
          docker build --target test -t postgres-s3-backup:test .
          docker run --rm postgres-s3-backup:test
      - name: Build runtime image
        run: docker build --target runtime -t postgres-s3-backup:dev .
      - name: Test dump, S3 download and actual restore
        shell: pwsh
        run: ./tests/smoke.ps1 -Image postgres-s3-backup:dev
